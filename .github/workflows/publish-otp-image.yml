name: Publish OTP Docker Image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update WMATA GTFS and OSM"]
    types: [completed]

jobs:
  publish-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OTP Graph
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/opentripplanner" \
            -e JAVA_OPTIONS="-Xmx12G" \
            opentripplanner/opentripplanner:latest --build --save

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/au-otp-server:latest
