name: Update WMATA GTFS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest WMATA GTFS ZIP
        run: |
          curl -v -X GET "https://api.wmata.com/gtfs/rail-bus-gtfs-static.zip" -H "Cache-Control: no-cache" -H "api_key: 6eb27769085d436294e417f4ea84cf51" -o rail-bus-gtfs-static.zip

      - name: Pull LFS data
        run: git lfs pull

      - name: Build OTP Graph
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/opentripplanner" \
            -e JAVA_OPTIONS="-Xmx12G" \
            opentripplanner/opentripplanner:latest --build --save

      - name: Upload Graph Artifact
        if: success() && hashFiles('graph.obj') != ''
        uses: actions/upload-artifact@v4
        with:
          name: otp-graph
          path: graph.obj

      - name: Commit updated GTFS file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail-bus-gtfs-static.zip
          git commit -m "Update WMATA GTFS" || echo "No changes to commit"
          git push
