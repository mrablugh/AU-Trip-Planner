name: Update WMATA GTFS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest WMATA GTFS ZIP
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
        run: |
          curl -v -X GET "https://api.wmata.com/gtfs/rail-bus-gtfs-static.zip" -H "Cache-Control: no-cache" -H "api_key: ${WMATA_API_KEY}" -o rail-bus-gtfs-static.zip

      - name: Pull LFS data
        run: git lfs pull

      - name: Inject WMATA API key into router config
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          path = pathlib.Path('router-config.json')
          text = path.read_text()
          text = text.replace('__WMATA_API_KEY__', os.environ['WMATA_API_KEY'])
          path.write_text(text)
          print('Injected WMATA API key into router-config.json')
          PY

      - name: Build OTP Graph
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/opentripplanner" \
            -e JAVA_OPTIONS="-Xmx12G" \
            opentripplanner/opentripplanner:latest --build --save

      - name: Upload Graph Artifact
        if: success() && hashFiles('graph.obj') != ''
        uses: actions/upload-artifact@v4
        with:
          name: otp-graph
          path: graph.obj

      - name: Commit updated GTFS file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail-bus-gtfs-static.zip
          git commit -m "Update WMATA GTFS" || echo "No changes to commit"
          git push
