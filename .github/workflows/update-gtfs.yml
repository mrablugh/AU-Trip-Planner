name: Update WMATA GTFS and OSM

on:
  push:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      osm_extract_url:
        description: 'Direct URL for the OSM PBF extract (optional)'
        required: false
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download latest WMATA GTFS ZIP
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
        run: |
          curl -L --fail --retry 3 -X GET "https://api.wmata.com/gtfs/rail-bus-gtfs-static.zip" -H "Cache-Control: no-cache" -H "api_key: ${WMATA_API_KEY}" -o rail-bus-gtfs-static.zip

      - name: Download latest OSM extract
        env:
          OSM_EXTRACT_URL: ${{ github.event.inputs.osm_extract_url || secrets.OSM_EXTRACT_URL || format('https://app.interline.io/osm_extracts/download_latest?string_id=dc-baltimore_maryland&data_format=pbf&api_token={0}', secrets.INTERLINE_API_KEY) }}
        run: |
          if [ -n "$OSM_EXTRACT_URL" ]; then
            echo "Downloading OSM extract from $OSM_EXTRACT_URL"
            curl -L --fail --retry 3 "$OSM_EXTRACT_URL" -o dc-baltimore_maryland.osm.pbf
          else
            echo "No OSM extract URL provided. Keeping the existing OSM file."
          fi

      - name: Pull LFS data
        run: git lfs pull

      - name: Inject WMATA API key into router config
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          path = pathlib.Path('router-config.json')
          text = path.read_text()
          text = text.replace('__WMATA_API_KEY__', os.environ['WMATA_API_KEY'])
          path.write_text(text)
          print('Injected WMATA API key into router-config.json')
          PY

      - name: Build OTP Graph
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/opentripplanner" \
            -e JAVA_OPTIONS="-Xmx12G" \
            opentripplanner/opentripplanner:latest --build --save

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/au-otp-server:latest

      - name: Upload Graph Artifact
        if: success() && hashFiles('graph.obj') != ''
        uses: actions/upload-artifact@v4
        with:
          name: otp-graph
          path: graph.obj

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail-bus-gtfs-static.zip dc-baltimore_maryland.osm.pbf
          git commit -m "Update WMATA GTFS and OSM data" || echo "No changes to commit"
          git push
