name: Update WMATA GTFS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest WMATA GTFS ZIP
        run: |
          curl -L https://www.wmata.com/gtfs/rail-bus-gtfs-static.zip -o rail-bus-gtfs-static.zip

      - name: Commit updated GTFS file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail-bus-gtfs-static.zip
          git commit -m "Update WMATA GTFS" || echo "No changes to commit"
          git push
